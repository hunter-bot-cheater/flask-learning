{% extends 'layout.html' %}

{% block body %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>编辑用户</h4>
                </div>
                <div class="card-body">
                    <!-- 错误提示 -->
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="post" action="/user/update">
                        <!-- 隐藏域：用户ID（必须传回） -->
                        <input type="hidden" name="edit_id" value="{{ user.id if user else '' }}">

                        <!-- 姓名 -->
                        <div class="mb-3">
                            <label class="form-label">真实姓名</label>
                            <input type="text" name="edit_name" class="form-control"
                                   value="{{ user.real_name if user else '' }}" required>
                        </div>

                        <!-- 手机号 -->
                        <div class="mb-3">
                            <label class="form-label">手机号</label>
                            <input type="text" name="edit_mobile" class="form-control"
                                   value="{{ user.mobile if user else '' }}" required>
                        </div>

                        <!-- 密码（所有用户都能改） -->
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="text" name="edit_password" class="form-control"
                                   placeholder="留空则不修改">
                            <small class="text-muted">如果不想修改密码，请留空</small>
                        </div>

                        <!-- 角色选择：仅管理员可见 -->
                        {% if role == 2 %}
                        <div class="mb-3">
                            <label class="form-label">角色</label>
                            <select name="edit_role" class="form-select">
                                <option value="1" {% if user.role == 1 %}selected{% endif %}>普通用户</option>
                                <option value="2" {% if user.role == 2 %}selected{% endif %}>管理员</option>
                            </select>
                        </div>
                        {% endif %}

                        <button type="submit" class="btn btn-primary">保存修改</button>
                        <a href="/user/list" class="btn btn-secondary">返回</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
